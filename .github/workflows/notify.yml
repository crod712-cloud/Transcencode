name: Transcencode Bootstrap Export

on:
  push:
    branches:
      - "transcencode/native-wpf-alpha"

permissions:
  contents: read

jobs:
  export:
    name: Export current native WPF bootstrap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate archive
        run: |
          set -euo pipefail
          xz --test transcencode/bootstrap/native-wpf-alpha.tar.xz
          tar -tJf transcencode/bootstrap/native-wpf-alpha.tar.xz >/dev/null
      - name: Upload bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: Transcencode-Native-WPF-Bootstrap
          path: transcencode/bootstrap/native-wpf-alpha.tar.xz
          if-no-files-found: error
