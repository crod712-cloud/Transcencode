name: Persist Authoritative Candidate Report

on:
  workflow_run:
    workflows:
      - "Transcencode Authoritative Windows Candidate"
      - "Transcencode Native WPF Tests"
      - "Transcencode Windows UI End-to-End"
      - "Transcencode Windows Runtime Smoke Tests"
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'transcencode/native-wpf-alpha'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: transcencode/native-wpf-alpha
          fetch-depth: 0

      - name: Persist complete workflow evidence summary
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p transcencode/test-results
          slug="$(printf '%s' "$WORKFLOW_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')"
          slug="${slug%-}"
          report="transcencode/test-results/${slug}-latest.md"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"

          {
            echo "# ${WORKFLOW_NAME}"
            echo
            echo "- Conclusion: **${CONCLUSION}**"
            echo "- Run: ${RUN_URL}"
            echo "- Commit: \`${HEAD_SHA}\`"
            echo "- Recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Jobs"
            echo
            jq -r '.jobs[] | "### " + .name + " — " + (.conclusion // .status), (.steps[]? | "- " + .name + ": " + (.conclusion // .status)), ""' <<<"${jobs}"
            echo "## Artifacts"
            echo
            jq -r 'if (.artifacts | length) == 0 then "- None" else .artifacts[] | "- " + .name + " (" + (.size_in_bytes|tostring) + " bytes, expired=" + (.expired|tostring) + ")" end' <<<"${artifacts}"
          } > "${report}"

          git config user.name "Transcencode CI Reporter"
          git config user.email "transcencode-ci@users.noreply.github.com"
          git add "${report}"
          if ! git diff --cached --quiet; then
            git commit -m "CI: record ${WORKFLOW_NAME} result (${CONCLUSION})"
            git push origin HEAD:transcencode/native-wpf-alpha
          fi

      - name: Comment concise result on native alpha pull request
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "**${WORKFLOW_NAME}: ${CONCLUSION}**\n\nRun: ${RUN_URL}\nCommit: \`${HEAD_SHA}\`\n\nThis is automated test evidence, not a release declaration."
