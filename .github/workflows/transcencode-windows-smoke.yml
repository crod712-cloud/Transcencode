name: Transcencode Windows Runtime Smoke Tests

on:
  workflow_dispatch:
  push:
    branches:
      - "transcencode/native-wpf-alpha"
  pull_request:
    branches:
      - master

concurrency:
  group: transcencode-windows-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime_smoke:
    name: Build, launch, analyze, encode, and inspect native WPF UI
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Apply native Transcencode GUI and hardening patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'transcencode/source/patch/Apply-TranscencodePatch.ps1' `
            -SourceRoot (Get-Location).Path `
            -OverlayRoot (Join-Path (Get-Location).Path 'transcencode/source/overlay')

          & 'transcencode/hardening/Apply-TranscencodeHardeningV2.ps1' `
            -SourceRoot (Get-Location).Path `
            -OverlayRoot (Join-Path (Get-Location).Path 'transcencode/hardening-overlay')

      - name: Download and verify official HandBrake 1.11.2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Path '.handbrake-runtime' -Force | Out-Null

          $libArchive = '.handbrake-runtime/LibHB-1.11.2-win-x86_64.zip'
          $cliArchive = '.handbrake-runtime/HandBrakeCLI-1.11.2-win-x86_64.zip'
          Invoke-WebRequest -Uri 'https://github.com/HandBrake/HandBrake/releases/download/1.11.2/LibHB-1.11.2-win-x86_64.zip' -OutFile $libArchive
          Invoke-WebRequest -Uri 'https://github.com/HandBrake/HandBrake/releases/download/1.11.2/HandBrakeCLI-1.11.2-win-x86_64.zip' -OutFile $cliArchive

          $libHash = (Get-FileHash $libArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $cliHash = (Get-FileHash $cliArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($libHash -ne 'd9bd679822f2c313f4918e7833eb2f57a9d2ceeb7ed0152343bc99c9cb44bdb0') {
            throw "LibHB checksum mismatch: $libHash"
          }
          if ($cliHash -ne '80bfe8d5f5d11cc3ef76b834add3ed4e82dee6523ffeb435c283f88b1a21f09d') {
            throw "HandBrakeCLI checksum mismatch: $cliHash"
          }

          Expand-Archive -LiteralPath $libArchive -DestinationPath '.handbrake-runtime/libhb' -Force
          Expand-Archive -LiteralPath $cliArchive -DestinationPath '.handbrake-runtime/cli' -Force

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish patched native WPF GUI and worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish 'win/CS/HandBrakeWPF/HandBrakeWPF.csproj' -p:PublishProfile=publish_x64
          dotnet publish 'win/CS/HandBrake.Worker/HandBrake.Worker.csproj' -p:PublishProfile=publish_x64

          $publish = 'win/CS/HandBrakeWPF/bin/publish'
          $worker = 'win/CS/HandBrake.Worker/bin/publish'
          Copy-Item "$worker/*" $publish -Recurse -Force

          $hbDll = Get-ChildItem '.handbrake-runtime/libhb' -Filter 'hb.dll' -Recurse | Select-Object -First 1
          $cli = Get-ChildItem '.handbrake-runtime/cli' -Filter 'HandBrakeCLI.exe' -Recurse | Select-Object -First 1
          if ($null -eq $hbDll) { throw 'Verified LibHB archive did not contain hb.dll.' }
          if ($null -eq $cli) { throw 'Verified CLI archive did not contain HandBrakeCLI.exe.' }
          Copy-Item $hbDll.FullName (Join-Path $publish 'hb.dll') -Force
          Copy-Item $cli.FullName (Join-Path $publish 'HandBrakeCLI.exe') -Force

          foreach ($required in @('HandBrake.exe','HandBrake.Worker.exe','HandBrakeCLI.exe','hb.dll')) {
            if (-not (Test-Path (Join-Path $publish $required))) {
              throw "Published runtime is missing $required."
            }
          }

      - name: Install ffmpeg test dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          }
          ffmpeg -version | Select-Object -First 1

      - name: Run complete Windows runtime and UI smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = 'transcencode/tests/Run-WindowsRuntimeSmoke.ps1'
          $scriptText = [System.IO.File]::ReadAllText($scriptPath)
          $oldLine = '    & $cli @Arguments 2>&1 | Tee-Object -FilePath $logPath'
          $newLine = '    & $cli @Arguments 2>&1 | Tee-Object -FilePath $logPath | Out-Null'
          if (-not $scriptText.Contains($oldLine, [System.StringComparison]::Ordinal)) {
            throw 'Runtime smoke harness output-suppression anchor was not found.'
          }
          $scriptText = $scriptText.Replace($oldLine, $newLine)
          [System.IO.File]::WriteAllText($scriptPath, $scriptText, [System.Text.UTF8Encoding]::new($false))

          & $scriptPath `
            -PublishDir 'win/CS/HandBrakeWPF/bin/publish' `
            -SmokeDir 'smoke'

      - name: Stage runtime-tested portable candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = 'win/CS/HandBrakeWPF/bin/publish'
          $candidate = 'artifacts/Transcencode-Test-Candidate'
          New-Item -ItemType Directory -Path $candidate -Force | Out-Null
          Copy-Item "$publish/*" $candidate -Recurse -Force
          Copy-Item 'smoke/RUNTIME-SMOKE-PASSED.txt' $candidate -Force

          @"
          Transcencode Native WPF Test Candidate
          Analyze. Encode. Verify.

          This candidate passed an automated Windows runtime test that launched
          the native graphical interface, loaded multilingual test media,
          exercised Source Tracks and Deep Analyze, applied the quality
          recommendation to the Video tab, verified black-bar preservation and
          automatic cropping, exercised every new tab, and changed/reset whole-
          interface scaling.

          The internal executable remains HandBrake.exe during compatibility
          testing. Extract the complete folder and keep every file together.
          "@ | Set-Content (Join-Path $candidate 'TEST-CANDIDATE.txt') -Encoding UTF8

          Compress-Archive `
            -Path $candidate `
            -DestinationPath 'artifacts/Transcencode-Native-WPF-Test-Candidate-x64.zip' `
            -Force

      - name: Upload runtime-tested portable candidate
        uses: actions/upload-artifact@v7
        with:
          name: Transcencode-Native-WPF-Test-Candidate-x64
          path: artifacts/Transcencode-Native-WPF-Test-Candidate-x64.zip
          if-no-files-found: error

      - name: Collect smoke-test diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path 'smoke')) { exit 0 }
          New-Item -ItemType Directory -Path 'smoke-diagnostics' -Force | Out-Null

          Get-ChildItem 'smoke' -File | ForEach-Object {
            if ($_.Length -lt 20MB) {
              Copy-Item $_.FullName 'smoke-diagnostics' -Force -ErrorAction SilentlyContinue
            }
          }

          foreach ($relative in @(
            'smoke/AppData/HandBrake',
            'smoke/LocalAppData/HandBrake',
            'smoke/AppData/Transcencode',
            'smoke/LocalAppData/Transcencode')) {
            if (Test-Path $relative) {
              Copy-Item $relative 'smoke-diagnostics' -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Transcencode-Windows-Smoke-Diagnostics
          path: smoke-diagnostics
          if-no-files-found: warn
